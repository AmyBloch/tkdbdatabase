<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tokyo Debunker Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="navbar">

        <div class="logo">
            <img src="logo.png" alt="Tokyo Debunker">
        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main>

        <!-- Hero -->

        <section class="hero">

            <div class="main-logo">
                <img src="logo.png" alt="Tokyo Debunker">
            </div>

            <div class="database-title">

                <span></span>

                DATABASE

                <span></span>

            </div>

        </section>


        <!-- =========================
             DATABASE SECTIONS
             ========================= -->

        <section class="database-grid">


            <!-- =========================
                 CARD DATABASE
                 ========================= -->

            <a
                href="characters.html"
                class="database-card"
            >

                <div class="card-icon card-stack">

                    <svg
                        width="64"
                        height="64"
                        viewBox="0 0 100 100"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <!-- LEFT CARD -->

                        <g transform="rotate(-28 50 55)">

                            <rect
                                x="26"
                                y="17"
                                width="42"
                                height="62"
                                rx="5"
                                fill="currentColor"
                            />

                            <path
                                d="
                                    M31 37
                                    C38 37 43 42 47 49
                                    C43 56 38 61 31 61
                                    Z
                                "
                                fill="rgba(15,10,22,0.92)"
                            />

                        </g>


                        <!-- RIGHT CARD -->

                        <g transform="rotate(28 50 55)">

                            <rect
                                x="32"
                                y="17"
                                width="42"
                                height="62"
                                rx="5"
                                fill="currentColor"
                            />

                            <path
                                d="
                                    M69 37
                                    C62 37 57 42 53 49
                                    C57 56 62 61 69 61
                                    Z
                                "
                                fill="rgba(15,10,22,0.92)"
                            />

                        </g>


                        <!-- CENTER CARD -->

                        <rect
                            x="31"
                            y="12"
                            width="38"
                            height="68"
                            rx="5"
                            fill="currentColor"
                        />

                        <rect
                            x="35"
                            y="16"
                            width="30"
                            height="60"
                            rx="3"
                            fill="rgba(15,10,22,0.25)"
                        />


                        <!-- CENTER DIAMOND -->

                        <path
                            d="
                                M50 31
                                L59 44
                                L50 57
                                L41 44
                                Z
                            "
                            fill="rgba(15,10,22,0.85)"
                        />

                        <path
                            d="
                                M50 35
                                L55 44
                                L50 53
                                L45 44
                                Z
                            "
                            fill="currentColor"
                        />

                    </svg>

                </div>

                <h2>Card Database</h2>

                <p>
                    View houses, members,<br>
                    cards, and more
                </p>

                <span class="arrow">›</span>

            </a>


            <!-- =========================
                 TEAMS
                 ========================= -->

            <a
                href="teams.html"
                class="database-card"
            >

                <div class="card-icon team-icon">

                    <svg
                        width="64"
                        height="64"
                        viewBox="0 0 100 100"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <!-- LEFT PERSON -->

                        <circle
                            cx="27"
                            cy="32"
                            r="10"
                            fill="currentColor"
                        />

                        <path
                            d="
                                M10 72
                                C10 57 17 49 27 49
                                C37 49 44 57 44 72
                                Z
                            "
                            fill="currentColor"
                        />


                        <!-- RIGHT PERSON -->

                        <circle
                            cx="73"
                            cy="32"
                            r="10"
                            fill="currentColor"
                        />

                        <path
                            d="
                                M56 72
                                C56 57 63 49 73 49
                                C83 49 90 57 90 72
                                Z
                            "
                            fill="currentColor"
                        />


                        <!-- CENTER PERSON -->

                        <circle
                            cx="50"
                            cy="28"
                            r="13"
                            fill="currentColor"
                        />

                        <path
                            d="
                                M27 82
                                C27 62 36 50 50 50
                                C64 50 73 62 73 82
                                Z
                            "
                            fill="currentColor"
                        />

                    </svg>

                </div>

                <h2>Teams</h2>

                <p>
                    Build and plan<br>
                    your teams
                </p>

                <span class="arrow">›</span>

            </a>


            <!-- =========================
                 BANNERS
                 ========================= -->

            <a
                href="banners.html"
                class="database-card"
            >

                <div class="card-icon banner-icon">

                    <svg
                        width="64"
                        height="64"
                        viewBox="0 0 100 100"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <!-- TOP ROD -->

                        <rect
                            x="18"
                            y="14"
                            width="64"
                            height="5"
                            rx="2.5"
                            fill="currentColor"
                        />


                        <!-- LEFT FINIAL -->

                        <circle
                            cx="15"
                            cy="16.5"
                            r="5"
                            fill="currentColor"
                        />


                        <!-- RIGHT FINIAL -->

                        <circle
                            cx="85"
                            cy="16.5"
                            r="5"
                            fill="currentColor"
                        />


                        <!-- LEFT CORD -->

                        <path
                            d="M23 19 V29"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                        />


                        <!-- RIGHT CORD -->

                        <path
                            d="M77 19 V29"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                        />


                        <!-- MAIN BANNER -->

                        <path
                            d="
                                M25 24
                                H75
                                V78
                                L50 66
                                L25 78
                                Z
                            "
                            fill="currentColor"
                        />


                        <!-- INNER BANNER -->

                        <path
                            d="
                                M29 28
                                H71
                                V70
                                L50 60
                                L29 70
                                Z
                            "
                            fill="rgba(15,10,22,0.28)"
                        />


                        <!-- CENTER DIAMOND -->

                        <path
                            d="
                                M50 39
                                L57 46
                                L50 53
                                L43 46
                                Z
                            "
                            fill="currentColor"
                        />

                    </svg>

                </div>

                <h2>Banners</h2>

                <p>
                    View current and<br>
                    previous banners
                </p>

                <span class="arrow">›</span>

            </a>


            <!-- =========================
                 RERUN DATA
                 ========================= -->

            <a
                href="rerun-data.html"
                class="database-card"
            >

                <div class="card-icon rerun-icon">

                    <svg
                        width="64"
                        height="64"
                        viewBox="0 0 100 100"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <!-- TOP / RIGHT ARROW -->

                        <path
                            d="
                                M72 28
                                C64 19 52 15 40 17
                                C26 19 16 30 14 43
                            "
                            stroke="currentColor"
                            stroke-width="7"
                            stroke-linecap="round"
                        />

                        <path
                            d="
                                M14 43
                                L14 27
                                M14 43
                                L29 40
                            "
                            stroke="currentColor"
                            stroke-width="7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />


                        <!-- BOTTOM / LEFT ARROW -->

                        <path
                            d="
                                M28 72
                                C36 81 48 85 60 83
                                C74 81 84 70 86 57
                            "
                            stroke="currentColor"
                            stroke-width="7"
                            stroke-linecap="round"
                        />

                        <path
                            d="
                                M86 57
                                L86 73
                                M86 57
                                L71 60
                            "
                            stroke="currentColor"
                            stroke-width="7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />


                        <!-- CENTER DIAMOND -->

                        <path
                            d="
                                M50 31
                                L69 50
                                L50 69
                                L31 50
                                Z
                            "
                            fill="currentColor"
                        />


                        <!-- INNER DIAMOND -->

                        <path
                            d="
                                M50 39
                                L61 50
                                L50 61
                                L39 50
                                Z
                            "
                            fill="rgba(15,10,22,0.92)"
                        />


                        <!-- CENTER POINT -->

                        <circle
                            cx="50"
                            cy="50"
                            r="4"
                            fill="currentColor"
                        />

                    </svg>

                </div>

                <h2>Rerun Data</h2>

                <p>
                    Check past rerun data
                </p>

                <span class="arrow">›</span>

            </a>

        </section>

    </main>


    <!-- =========================
         BOTTOM DECORATION
         ========================= -->

    <div class="bottom-decoration">

        <span></span>

        <b>✦</b>

        <span></span>

    </div>


</body>

</html>
