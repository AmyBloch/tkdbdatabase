<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Banners | Tokyo Debunker Database</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           BANNERS PAGE
           ========================= */

        .banner-page {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 50px 20px 80px;
            box-sizing: border-box;
        }


        /* =========================
           PAGE TITLE
           ========================= */

        .banner-header {
            text-align: center;
            margin-bottom: 55px;
        }

        .banner-header h1 {
            margin: 0;

            color: #eee5f4;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 7px;
        }

        .banner-header p {
            margin: 12px 0 0;

            color: #a99ab8;
            font-size: 13px;
            letter-spacing: 2px;
        }


        /* =========================
           BANNER OPTIONS
           ========================= */

        .banner-options {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }


        /* =========================
           BUTTON / CARD
           ========================= */

        .banner-option {
            position: relative;

            min-height: 210px;
            padding: 30px 20px;

            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            text-decoration: none;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 20, 48, 0.95),
                    rgba(15, 10, 22, 0.98)
                );

            border: 1px solid rgba(180, 145, 215, 0.35);
            border-radius: 4px;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }


        .banner-option:hover {
            transform: translateY(-5px);

            border-color:
                rgba(201, 156, 255, 0.85);

            box-shadow:
                0 12px 30px
                rgba(100, 60, 150, 0.25);
        }


        /* =========================
           ICON
           ========================= */

        .banner-option .card-icon {
            width: 70px;
            height: 70px;

            margin-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #c99cff;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(180, 120, 240, 0.25)
                );
        }

        .banner-option .card-icon svg {
            width: 64px;
            height: 64px;
        }


        /* =========================
           TEXT
           ========================= */

        .banner-option h2 {
            margin: 0 0 8px;

            color: #eee5f4;

            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .banner-option p {
            margin: 0;

            color: #a99ab8;

            font-size: 12px;
            line-height: 1.6;
        }


        /* =========================
           ARROW
           ========================= */

        .banner-option .arrow {
            position: absolute;

            right: 15px;
            bottom: 12px;

            color: #9d7ab8;

            font-size: 23px;

            transition:
                transform 0.25s ease,
                color 0.25s ease;
        }

        .banner-option:hover .arrow {
            color: #d5b2f5;
            transform: translateX(4px);
        }


        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 850px) {

            .banner-options {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .banner-page {
                padding: 35px 16px 60px;
            }

            .banner-header {
                margin-bottom: 40px;
            }

            .banner-header h1 {
                font-size: 27px;
                letter-spacing: 5px;
            }

            .banner-header p {
                font-size: 11px;
                letter-spacing: 1.5px;
            }

            .banner-options {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .banner-option {
                min-height: 190px;
            }

        }

    </style>

</head>
